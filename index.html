<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquete 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #e4e4dc;
    --papel: #f3f2ed;
    --tinta: #1b1e1c;
    --suave: #686c66;
    --linha: #cfcfc6;
    --destaque: #2a3ab8;
    --vendido: #777a74;
    --sombra-modal: 0 24px 70px rgb(27 30 28 / .25);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    background: var(--fundo);
    color: var(--tinta);
    font: 400 15px/1.45 "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { cursor: default; opacity: .35; }
  :focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }

  #cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; transition: opacity .35s; }
  body[data-vista="planta"] #cena { opacity: 0; pointer-events: none; }
  .veu {
    position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, var(--fundo) 0, color-mix(in srgb, var(--fundo) 86%, transparent) 20%, transparent 40%),
      linear-gradient(270deg, var(--fundo) 0, color-mix(in srgb, var(--fundo) 84%, transparent) 18%, transparent 32%),
      linear-gradient(0deg, var(--fundo) 0, transparent 18%),
      linear-gradient(180deg, var(--fundo) 0, transparent 12%);
  }

  .topo {
    position: fixed; inset: 0 0 auto; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px 44px; pointer-events: none;
  }
  .topo > * { pointer-events: auto; }
  .marca { display: block; text-align: left; }
  .marca b { display: block; font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .marca span { font-size: 12px; color: var(--suave); }
  .nav { display: flex; align-items: center; gap: 28px; font-size: 14px; }
  .nav .texto { padding: 6px 0; border-bottom: 1px solid transparent; }
  .nav .texto:hover { border-color: currentColor; }
  .nav .curto { display: none; }
  .caixa { padding: 10px 16px; border: 1px solid var(--tinta); border-radius: 2px; }
  .caixa:hover { background: var(--tinta); color: var(--papel); }

  /* Vista do prédio */
  .vista { position: fixed; inset: 0; z-index: 2; pointer-events: none; transition: opacity .3s; }
  .vista[hidden] { display: none; }
  .vista > * { pointer-events: auto; }
  .chamada { position: absolute; left: 44px; bottom: 44px; width: min(320px, 30vw); pointer-events: none; }
  .chamada h1 { margin: 0 0 14px; font-size: clamp(32px, 3.5vw, 50px); line-height: 1.04; font-weight: 500; letter-spacing: -.025em; }
  .chamada p { margin: 0 0 24px; color: var(--suave); font-size: 14px; }
  .numeros { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px 24px; margin: 0; }
  .numeros dt { font-size: 12px; color: var(--suave); }
  .numeros dd { margin: 0; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .andares { position: absolute; right: 44px; top: 50%; translate: 0 -46%; width: 250px; }
  .andares h2 { margin: 0 0 8px; font-size: 13px; font-weight: 400; color: var(--suave); }
  .andares ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linha); }
  .andares li { border-bottom: 1px solid var(--linha); }
  .andar {
    display: grid; grid-template-columns: 34px 1fr auto; align-items: center; width: 100%;
    padding: 6px 0; text-align: left; font-size: 13px; color: var(--suave);
  }
  .andar b { font-size: 15px; font-weight: 600; color: var(--tinta); font-variant-numeric: tabular-nums; }
  .andar:hover, .andar.ativo, .andar.ativo b { color: var(--destaque); }
  .quadros { display: flex; gap: 3px; }
  .q { width: 11px; height: 11px; border: 1px solid var(--vendido); border-radius: 1px; flex: none; }
  .q.vendido { background: var(--vendido); }
  .q.reservado { background: linear-gradient(135deg, transparent 44%, var(--vendido) 44% 56%, transparent 56%); }

  .dica-base { margin: 10px 0 0; font-size: 12px; color: var(--suave); }
  body[data-vista="predio"] { --fundo: var(--ceu, #e4e4dc); }
  body[data-vista="predio"].escuro, .quadro-3d.escuro { --tinta: #ecebe4; --suave: #a3a9b6; --linha: #3d4456; --papel: #262c3a; --vendido: #8d93a0; }
  body[data-vista="predio"].escuro .caixa:hover { color: #151a24; }
  .quadro-3d.escuro { color: var(--tinta); }
  .sol { position: absolute; left: 50%; bottom: 18px; translate: -50% 0; width: min(440px, calc(100vw - 32px)); padding: 10px 14px 8px; background: color-mix(in srgb, var(--papel) 82%, transparent); border: 1px solid var(--linha); border-radius: 2px; backdrop-filter: blur(6px); }
  .sol[hidden] { display: none; }
  .sol.no-apto { left: 10px; right: auto; top: auto; bottom: 10px; translate: none; width: min(420px, calc(100% - 20px)); z-index: 3; }
  .sol-ponto { position: absolute; z-index: 4; width: 28px; height: 28px; margin: -14px 0 0 -14px; display: grid; place-items: center; font-size: 16px; line-height: 1; color: #c26a12; background: color-mix(in srgb, var(--papel) 86%, transparent); border: 1.5px solid #e29a45; border-radius: 50%; pointer-events: none; }
  .vista > .sol-ponto { pointer-events: none; }
  .sol-ponto[hidden] { display: none; }
  .sol-linha { display: flex; align-items: center; gap: 12px; }
  .sol-tocar { width: 30px; height: 30px; flex: none; border: 1px solid var(--tinta); border-radius: 50%; font-size: 11px; }
  .sol-hora { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sol-hora input { flex: 1; min-width: 0; accent-color: var(--destaque); }
  .sol select { padding: 5px 6px; background: transparent; border: 1px solid var(--linha); border-radius: 2px; font-size: 13px; color: var(--tinta); }
  .sol select option { color: #1b1e1c; }
  .sol p { margin: 6px 0 0; font-size: 12px; color: var(--suave); }
  @media (max-width: 1180px) and (min-width: 901px) { .sol { bottom: auto; top: 76px; } }
  .rotulo { position: fixed; z-index: 3; pointer-events: none; color: var(--destaque); font-size: 13px; text-align: right; translate: -100% -50%; padding-right: 44px; white-space: nowrap; }
  .rotulo::after { content: ""; position: absolute; right: 6px; top: 50%; width: 30px; border-top: 1px solid currentColor; }
  .rotulo b { display: block; font-weight: 600; }
  .rotulo span { color: var(--tinta); font-size: 12px; }

  /* Vista da planta */
  .planta-vista { display: grid; grid-template-columns: minmax(0, 1fr) auto; background: var(--fundo); padding-top: 84px; }
  .planta-area { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 0 44px 12px; }
  .barra { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--linha); font-size: 13px; color: var(--suave); }
  .voltar { display: inline-flex; gap: 10px; align-items: center; color: var(--tinta); font-size: 14px; }
  .voltar:hover { color: var(--destaque); }
  .barra h2 { margin: 0; padding-left: 22px; border-left: 1px solid var(--linha); font-size: 24px; font-weight: 500; letter-spacing: -.015em; color: var(--tinta); }
  .setas { display: flex; gap: 8px; }
  .setas button { width: 34px; height: 34px; background: var(--papel); border: 1px solid var(--linha); border-radius: 2px; color: var(--tinta); }
  .setas button:not(:disabled):hover { border-color: var(--tinta); }
  .legenda { display: flex; gap: 16px; margin-left: auto; font-size: 12px; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; }
  .quadro-planta { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 8px 0; }
  .quadro-planta svg { display: block; width: 100%; height: 100%; max-height: 100%; min-width: 620px; }
  .quadro-planta[hidden], .quadro-3d[hidden], .legenda[hidden], .modos[hidden] { display: none; }
  .quadro-3d { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--ceu, var(--fundo)); }
  #cena-apto { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #cena-apto:active { cursor: grabbing; }
  .etiquetas { position: absolute; inset: 0; pointer-events: none; }
  .etq { position: absolute; left: 0; top: 0; padding: 1px 6px; font-size: 11px; line-height: 1.25; text-align: center; white-space: nowrap; color: var(--suave); background: color-mix(in srgb, var(--papel) 72%, transparent); border-radius: 2px; }
  .etq b { display: block; font-weight: 600; color: var(--tinta); }
  .etq.ativa { background: var(--destaque); color: #fff; z-index: 1; }
  .etq.ativa b { color: #fff; }
  .modos { display: flex; margin-left: auto; border: 1px solid var(--tinta); border-radius: 2px; }
  .modos button { padding: 7px 16px; font-size: 13px; color: var(--tinta); }
  .modos button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
  .tit-comodos { margin: 0 0 4px; font-size: 12px; font-weight: 400; color: var(--suave); }
  .comodos { list-style: none; margin: 0 0 18px; padding: 0; border-top: 1px solid var(--linha); }
  .comodos button { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; padding: 8px 6px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--linha); }
  .comodos small { margin-left: 8px; font-size: 12px; color: var(--suave); }
  .comodos b { font-weight: 600; white-space: nowrap; }
  .comodos button:hover, .comodos button.ativo { background: var(--destaque); color: #fff; }
  .comodos button:hover small, .comodos button.ativo small { color: inherit; }
  .pe-planta { margin: 0; text-align: center; font-size: 13px; color: var(--suave); }

  .ficha {
    width: 0; overflow: hidden; background: var(--papel); border-left: 1px solid var(--linha);
    transition: width .3s ease;
  }
  .ficha.aberta { width: 430px; overflow-y: auto; }
  .ficha-corpo { width: 430px; padding: 18px 36px 24px; }
  .ficha .sub { margin: 18px 0 2px; font-size: 13px; color: var(--suave); }
  .ficha h3 { margin: 0; font-size: 27px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
  .ficha .desc { margin: 2px 0 20px; color: var(--suave); font-size: 15px; }
  .preco { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 0 12px; border-top: 1px solid var(--tinta); border-bottom: 1px solid var(--linha); }
  .preco strong { font-size: 36px; font-weight: 600; letter-spacing: -.025em; line-height: 1.1; }
  .preco s { color: var(--vendido); text-decoration-thickness: 2px; }
  .estado { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; white-space: nowrap; }
  .estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--vendido); }
  .estado.disponivel::before { background: var(--destaque); }
  .fatos { display: grid; grid-template-columns: 1fr 1fr; margin: 0; }
  .fatos div { padding: 10px 0; border-bottom: 1px solid var(--linha); }
  .fatos dt { font-size: 12px; color: var(--suave); }
  .fatos dd { margin: 0; font-size: 18px; font-weight: 600; }
  .linhas { margin: 0 0 18px; }
  .linhas div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--linha); font-size: 13px; }
  .linhas dt { color: var(--suave); }
  .linhas dd { margin: 0; text-align: right; }
  .botao { display: block; width: 100%; padding: 15px; text-align: center; font-weight: 600; font-size: 15px; border-radius: 1px; border: 1px solid var(--linha); background: transparent; }
  .botao:hover { border-color: var(--tinta); }
  .botao.forte { background: var(--destaque); border-color: var(--destaque); color: #fff; margin-bottom: 10px; }
  .botao.forte:hover { filter: brightness(1.14); }
  .nota { margin: 14px 0 0; font-size: 12px; color: var(--suave); }

  .dica-apto { position: fixed; z-index: 8; pointer-events: none; padding: 9px 14px; background: var(--tinta); color: #f4f3ee; font-size: 13px; border-radius: 1px; white-space: nowrap; }
  .dica-apto b { display: block; font-weight: 600; font-size: 14px; }
  .dica-apto[hidden] { display: none; }

  dialog { border: 0; padding: 0; background: var(--papel); color: var(--tinta); width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); box-shadow: var(--sombra-modal); }
  dialog::backdrop { background: rgb(27 30 28 / .42); }
  .modal { padding: 26px 30px 28px; }
  .modal header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .modal h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .fechar { width: 30px; height: 30px; font-size: 20px; line-height: 1; }
  .modal .sub { margin: 4px 0 14px; font-size: 13px; color: var(--suave); }
  .campo { display: block; margin-bottom: 11px; font-size: 13px; font-weight: 500; }
  .campo small { color: var(--suave); font-weight: 400; font-size: 13px; }
  .campo input, .campo textarea { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; background: #fff; border: 1px solid var(--linha); border-radius: 1px; font-weight: 400; }
  .campo textarea { min-height: 76px; resize: vertical; }
  .marcar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; font-size: 13px; }
  .modal-texto p { margin: 0 0 12px; font-size: 14px; color: var(--suave); }
  .grade-sobre { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; margin: 16px 0 0; }
  .grade-sobre div { padding: 10px 0; border-top: 1px solid var(--linha); }
  .grade-sobre dt { font-size: 12px; color: var(--suave); }
  .grade-sobre dd { margin: 0; font-size: 14px; font-weight: 500; }

  .aviso { position: fixed; left: 50%; top: 92px; translate: -50% 0; z-index: 9; max-width: min(520px, calc(100vw - 32px)); padding: 12px 16px; background: var(--tinta); color: #f4f3ee; font-size: 14px; }
  .aviso[hidden] { display: none; }

  @media (max-width: 900px) {
    .topo { padding: 14px 16px; }
    .nav { gap: 14px; font-size: 13px; }
    .caixa { padding: 8px 12px; }
    .veu { background: linear-gradient(0deg, var(--fundo) 28%, transparent 52%), linear-gradient(180deg, var(--fundo) 0, transparent 14%); }
    .chamada { left: 16px; right: 16px; bottom: 100px; width: auto; }
    .chamada h1 { font-size: 30px; margin-bottom: 8px; }
    .chamada p { display: none; }
    .numeros { grid-template-columns: repeat(4, auto); gap: 0 16px; }
    .numeros div { display: contents; }
    .numeros dt { grid-row: 1; }
    .numeros dd { grid-row: 2; font-size: 15px; }
    .andares { left: 0; right: 0; top: auto; bottom: 12px; width: auto; translate: none; padding: 0 16px; }
    .andares h2 { display: none; }
    .andares ol { display: flex; gap: 6px; overflow-x: auto; border: 0; padding-bottom: 4px; }
    .andares li { border: 0; flex: none; }
    .andar { display: flex; flex-direction: column; gap: 2px; width: 64px; padding: 6px 4px; background: var(--papel); border: 1px solid var(--linha); text-align: center; font-size: 11px; }
    .andar .quadros { display: none; }
    .dica-base, .rotulo { display: none; }
    .sol { bottom: auto; top: 58px; padding: 8px 10px 6px; }
    .sol-linha { gap: 8px; }
    .sol select { max-width: 38%; }
    .sol p { font-size: 11px; }
    .planta-vista { grid-template-columns: minmax(0, 1fr); padding-top: 66px; }
    .planta-area { padding: 0 16px 10px; }
    .barra { gap: 10px 14px; }
    .barra h2 { font-size: 20px; padding-left: 14px; }
    .barra p { order: 3; flex-basis: 100%; margin: 0; }
    .legenda { display: none; }
    .quadro-planta { place-items: start; }
    .quadro-planta svg { height: auto; }
    .pe-planta { display: none; }
    .ficha { position: fixed; inset: auto 0 0; z-index: 6; width: 100%; height: 0; border: 0; transition: height .3s ease; }
    .ficha.aberta { width: 100%; height: 56dvh; box-shadow: var(--sombra-modal); }
    .planta-vista:has(.ficha.aberta) .planta-area { padding-bottom: calc(56dvh + 6px); }
    body[data-modo="3d"] .ficha.aberta { height: 36dvh; }
    body[data-modo="3d"] .planta-vista:has(.ficha.aberta) .planta-area { padding-bottom: calc(36dvh + 6px); }
    body[data-modo="3d"] #andar-resumo { display: none; }
    .etq { font-size: 10px; padding: 1px 4px; }
    .etq:not(.ativa) { display: none; }
    .ficha-corpo { width: 100%; padding: 14px 16px 20px; }
  }
  @media (max-width: 560px) {
    .marca { min-width: 0; }
    .marca b { font-size: 12px; letter-spacing: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .marca span, #ir-residencias, .nav .longo { display: none; }
    .nav .curto { display: inline; }
    .nav { flex: none; white-space: nowrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",

} }
</script>
</head>
<body data-vista="predio">
<canvas id="cena" aria-label="Maquete 3D do prédio. Use a lista de andares para navegar sem o mouse."></canvas>
<div class="veu" id="veu"></div>

<header class="topo">
  <button class="marca" id="marca" type="button"><b></b><span></span></button>
  <nav class="nav" aria-label="Principal">
    <button class="texto" id="ir-residencias" type="button">Residências</button>
    <button class="texto" id="ir-sobre" type="button" aria-label="O empreendimento"><span class="longo">O empreendimento</span><span class="curto">Sobre</span></button>
    <button class="caixa" id="ir-contato" type="button">Contato</button>
  </nav>
</header>

<section class="vista" id="vista-predio" aria-label="Prédio">
  <div class="chamada">
    <h1 id="titulo"></h1>
    <p id="resumo"></p>
    <dl class="numeros" id="numeros"></dl>
  </div>
  <div class="andares">
    <h2>Andares</h2>
    <ol id="lista-andares"></ol>
    <p class="dica-base">Selecione um andar para ver os apartamentos</p>
  </div>
  <div class="sol" id="sol" role="group" aria-label="Sol e sombra" hidden>
    <div class="sol-linha">
      <button class="sol-tocar" id="sol-tocar" type="button" aria-label="Passar o dia">▶</button>
      <label class="sol-hora"><span id="sol-hora-txt"></span><input type="range" id="sol-hora" min="0" max="1435" step="5" aria-label="Hora do dia"></label>
      <select id="sol-data" aria-label="Dia do ano"></select>
    </div>
    <p id="sol-info" aria-live="polite"></p>
  </div>
</section>
<div class="rotulo" id="rotulo" hidden></div>

<section class="vista planta-vista" id="vista-planta" aria-label="Planta do andar" hidden>
  <div class="planta-area">
    <div class="barra">
      <button class="voltar" id="voltar" type="button"><span aria-hidden="true">←</span> Voltar ao prédio</button>
      <h2 id="andar-titulo"></h2>
      <p id="andar-resumo" style="margin:0"></p>
      <div class="setas">
        <button id="descer" type="button" aria-label="Andar abaixo">↓</button>
        <button id="subir" type="button" aria-label="Andar acima">↑</button>
      </div>
      <div class="legenda" id="legenda" aria-hidden="true">
        <span><i class="q"></i>Disponível</span>
        <span><i class="q reservado"></i>Reservado</span>
        <span><i class="q vendido"></i>Vendido</span>
      </div>
      <div class="modos" id="modos" role="group" aria-label="Forma de ver o apartamento" hidden>
        <button id="modo-planta" type="button" aria-pressed="true">Planta</button>
        <button id="modo-3d" type="button" aria-pressed="false">3D</button>
      </div>
    </div>
    <div class="quadro-planta" id="quadro-planta"></div>
    <div class="quadro-3d" id="quadro-3d" hidden>
      <canvas id="cena-apto" aria-label="Apartamento em 3D, sem teto. Use a lista de cômodos para navegar sem o mouse."></canvas>
      <div class="etiquetas" id="etiquetas" aria-hidden="true"></div>
    </div>
    <p class="pe-planta" id="pe-planta"></p>
  </div>
  <aside class="ficha" id="ficha" aria-label="Detalhes do apartamento"></aside>
</section>

<div class="dica-apto" id="dica-apto" hidden></div>
<div class="aviso" id="aviso" role="alert" hidden></div>

<dialog id="modal-contato"><div class="modal" id="contato-corpo"></div></dialog>
<dialog id="modal-sobre"><div class="modal modal-texto" id="sobre-corpo"></div></dialog>

<!-- ============================================================

    arbusto: e => [{ g: degrade(new THREE.SphereGeometry(1, 9, 6).scale(e.raio, e.altura * .55, e.raio), e.cor).translate(0, e.altura * .45, 0), cor: '#ffffff', degrade: true }],
    palmeira: e => {
      const pecas = [tronco(e, e.altura, .22)];
      const n = e.folhas || 8;
      for (let i = 0; i < n; i++) {
        const f = new THREE.SphereGeometry(1, 6, 4).scale(e.raio * .55, .1, .34);
        f.translate(e.raio * .55, 0, 0).rotateZ(-.42).rotateY(i / n * Math.PI * 2).translate(0, e.altura, 0);
        pecas.push({ g: degrade(f, e.cor), cor: '#ffffff', degrade: true });
      }
      return pecas;
    },
  };
  const plantas = [];
  for (const f of P.terreno.fileiras || []) {
    for (let i = 0; i < f.quantidade; i++) {
      const k = f.quantidade === 1 ? 0 : i / (f.quantidade - 1);
      plantas.push({ especie: f.especie, x: f.de[0] + (f.ate[0] - f.de[0]) * k, z: f.de[1] + (f.ate[1] - f.de[1]) * k, escala: f.escala });
    }
  }
  plantas.push(...(P.terreno.plantio || []));
  const porEspecie = {};
  plantas.forEach(p => (porEspecie[p.especie] ||= []).push(p));
  for (const [nome, lista] of Object.entries(porEspecie)) {
    const e = P.terreno.especies[nome];
    const forma = e && FORMAS[e.forma];
    if (!forma) { console.warn(`Espécie ou forma desconhecida: ${nome}`); continue; }
    for (const peca of forma(e)) {
      const mat = lambert(peca.cor, { vertexColors: peca.degrade });
      const m = new THREE.InstancedMesh(peca.g, mat, lista.length);
      const mx = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
      lista.forEach((p, i) => {
        const s = (p.escala || 1);
        q.setFromAxisAngle(up, (i * 2.4) % 6.28);
        mx.compose(new THREE.Vector3(p.x, 0, p.z), q, new THREE.Vector3(s, s, s));
        m.setMatrixAt(i, mx);
      });
      m.castShadow = m.receiveShadow = true;
      scene.add(m);
    }
  }

  /* Prédio */
  const F = D.fachada, cores = D.cores;
  const larg = Math.max(...D.laje.map(p => p[0])), prof = Math.max(...D.laje.map(p => p[1]));
  const raiz = new THREE.Group();
  raiz.position.set(D.posicao?.[0] || 0, 0, D.posicao?.[1] || 0);
  raiz.rotation.y = (D.rotacao || 0) * Math.PI / 180;
  const predio = new THREE.Group();
  predio.position.set(-larg / 2, 0, -prof / 2);
  raiz.add(predio);
  scene.add(raiz);

  const nAndares = P.andares.length;
  const baseAndar = n => D.terreo.altura + (n - 1) * D.alturaAndar;
  const altura = baseAndar(nAndares + 1);
  const estrutura = lambert(cores.estrutura);
  const vidros = lote(new THREE.MeshLambertMaterial({ color: cores.vidro }));
  const vidrosBase = lote(new THREE.MeshLambertMaterial({ color: cores.vidroTerreo }));
  const matLuz = new THREE.MeshBasicMaterial({ color: '#ffd296', transparent: true, opacity: 0, depthWrite: false });
  const luzes = lote(matLuz);
  const acesa = (n, p) => ((n * 7919 + Math.round(p[0] * 31 + p[1] * 17)) * 2654435761 >>> 0) % 100 < 46;
  const caixilhos = lote(lambert(cores.caixilho));
  const pilares = lote(estrutura);
  const balancos = lote(estrutura);
  const corrimaos = lote(lambert(cores.caixilho));
  const paineis = lote(new THREE.MeshLambertMaterial({ color: cores.vidroGuarda, transparent: true, opacity: .32, depthWrite: false }));

  function vaos(poly, cada) {
    poly.forEach((a, i) => {
      const b = poly[(i + 1) % poly.length];
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy), n = Math.max(1, Math.round(l / F.vao));
      for (let k = 0; k < n; k++) {
        const t0 = k / n, t1 = (k + 1) / n;
        cada([a[0] + dx * t0, a[1] + dy * t0], [a[0] + dx * t1, a[1] + dy * t1], l / n, k === 0);
      }
    });
  }
  const linhaVidro = deslocar(D.envidracado, -F.recuoVidro);
  const pe = D.alturaAndar - F.espessuraLaje;

  vaos(linhaVidro, (a, b) => {
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    const ang = -Math.atan2(dy, dx), meio = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    vidrosBase.viga(a, b, D.terreo.altura / 2, .1, D.terreo.altura);
    luzes.viga(a, b, D.terreo.altura / 2, .13, D.terreo.altura - .4);
    caixilhos.viga(a, b, D.terreo.altura * .72, .14, .08);
    for (let n = 1; n <= nAndares; n++) {
      const y = baseAndar(n) + F.espessuraLaje, cy = y + pe / 2;
      vidros.viga(a, b, cy, .1, pe);
      if (acesa(n, a)) luzes.viga(a, b, cy, .13, pe - .12);
      caixilhos.caixa(meio[0], cy, meio[1], .07, pe, .16, ang);
      caixilhos.viga(a, b, y + pe * .62, .16, .07);
      if (l > 2.5) {
        for (const s of [-.5, .5]) caixilhos.caixa(meio[0] + dx * s, cy, meio[1] + dy * s, .1, pe, .16, ang);
      }
    }
  });
  vaos(D.laje, a => pilares.caixa(a[0], altura / 2, a[1], F.pilar, altura, F.pilar));
  for (const p of D.envidracado) pilares.caixa(p[0], altura / 2, p[1], F.pilar * .8, altura, F.pilar * .8);

  const lajeG = prisma(deslocar(D.laje, F.beiral), F.espessuraLaje);
  const lajes = new THREE.InstancedMesh(lajeG, estrutura, nAndares);
  const mxL = new THREE.Matrix4();
  for (let n = 1; n <= nAndares; n++) lajes.setMatrixAt(n - 1, mxL.makeTranslation(0, baseAndar(n), 0));
  lajes.castShadow = lajes.receiveShadow = true;
  predio.add(lajes);

  function guarda(a, b, y, fora = 0) {
    corrimaos.viga(a, b, y + 1.08, .05, .05, fora);
    corrimaos.viga(a, b, y + .55, .025, .025, fora);
    paineis.viga(a, b, y + .56, .03, 1.02, fora);
  }
  for (let n = 1; n <= nAndares; n++) {
    const y = baseAndar(n) + F.espessuraLaje;
    for (const linha of D.guardaCorpos || []) linha.forEach((a, i) => { if (linha[i + 1]) guarda(a, linha[i + 1], y); });
    for (const b of D.balancos || []) {
      const { x, y: z, largura: l, profundidade: p } = b;
      balancos.caixa(x + l / 2, y - .1, z + p / 2, l, .2, p);
      const c = [[x, z], [x + l, z], [x + l, z + p], [x, z + p]];
      const lado = { sul: [[c[1], c[2]], [c[2], c[3]], [c[3], c[0]]], norte: [[c[3], c[0]], [c[0], c[1]], [c[1], c[2]]], leste: [[c[0], c[1]], [c[1], c[2]], [c[2], c[3]]], oeste: [[c[2], c[3]], [c[3], c[0]], [c[0], c[1]]] }[b.lado || 'sul'];
      for (const [u, v] of lado) guarda(u, v, y);
    }
  }

  /* Cobertura */
  const cob = D.cobertura;
  predio.add(malha(prisma(deslocar(D.laje, F.beiral + .08), .55, altura), lambert(cores.cobertura)));
  if (cob.casaDeMaquinas) {
    const c = cob.casaDeMaquinas, base = altura + .55;
    const caixa = malha(unidade, lambert(cores.casaDeMaquinas));
    caixa.scale.set(c.largura, c.altura, c.profundidade);
    caixa.position.set(c.x + c.largura / 2, base + c.altura / 2, c.y + c.profundidade / 2);
    predio.add(caixa);
    const frisos = lote(lambert(new THREE.Color(cores.casaDeMaquinas).multiplyScalar(.82)));
    for (let x = .35; x < c.largura; x += .7) {
      frisos.caixa(c.x + x, base + c.altura * .45, c.y + c.profundidade + .04, .08, c.altura * .9, .08);
      frisos.caixa(c.x + x, base + c.altura * .45, c.y - .04, .08, c.altura * .9, .08);
    }
    frisos.criar(predio);
  }
  const verdes = lote(lambert(cores.canteiro));
  for (const k of cob.canteiros || []) verdes.caixa(k.x + k.largura / 2, altura + .75, k.y + k.profundidade / 2, k.largura, .4, k.profundidade);
  verdes.criar(predio);

  for (const m of D.marquises || []) {
    const c = malha(unidade, lambert(cores.estrutura));
    c.scale.set(m.largura, m.espessura || .3, m.profundidade);
    c.position.set(m.x + m.largura / 2, m.altura, m.y + m.profundidade / 2);
    predio.add(c);
  }
  [vidros, vidrosBase, caixilhos, pilares, balancos, corrimaos].forEach(l => l.criar(predio));
  paineis.criar(predio, { lanca: false, recebe: false });
  luzes.criar(predio, { lanca: false, recebe: false });

  /* Andares clicáveis e faixa de destaque */
  const alvos = [];
  const alvoMat = new THREE.MeshBasicMaterial();
  for (const a of P.andares) {
    const m = new THREE.Mesh(prisma(deslocar(D.laje, .5), D.alturaAndar, baseAndar(a.numero)), alvoMat);
    m.visible = false;
    m.userData.andar = a.numero;
    predio.add(m);
    alvos.push(m);
  }
  const faixa = new THREE.Mesh(
    prisma(deslocar(D.laje, .3), D.alturaAndar - .06),
    new THREE.MeshBasicMaterial({ color: A.destaque, transparent: true, opacity: .42, depthWrite: false, fog: false }),
  );
  faixa.visible = false;
  predio.add(faixa);

  /* Sol, céu e noite: el e az em graus, az medido a partir do norte no sentido horário */
  const CEU = [[-12, '#151a24'], [-6, '#252c3d'], [-2, '#7f7887'], [2, '#e4c9ad'], [9, A.fundo]];
  function corCeu(el) {
    if (el <= CEU[0][0]) return new THREE.Color(CEU[0][1]);
    for (let i = 1; i < CEU.length; i++) {
      if (el > CEU[i][0]) continue;
      const [e0, c0] = CEU[i - 1], [e1, c1] = CEU[i];
      return new THREE.Color(c0).lerp(new THREE.Color(c1), (el - e0) / (e1 - e0));
    }
    return new THREE.Color(A.fundo);
  }
  const norte = (P.terreno.norte || 0) * Math.PI / 180;
  const limitar = THREE.MathUtils.clamp;
  function aplicarSol({ el, az }) {
    const e = el * Math.PI / 180, a = az * Math.PI / 180 - norte;
    sol.position.set(Math.sin(a) * Math.cos(e), Math.sin(e), -Math.cos(a) * Math.cos(e)).multiplyScalar(420);
    disco.position.copy(sol.position);
    ajustarDiscoSol(disco, { el });
    posicionarFeixes(sol.position.clone().normalize(), limitar(el / 12, 0, 1));
    const dia = limitar(el / 12, 0, 1), noite = limitar((2 - el) / 8, 0, 1);
    sol.intensity = A.luzSol * dia;
    sol.color.set('#ffb36b').lerp(new THREE.Color('#fffaf0'), limitar(el / 25, 0, 1));
    chao.material.opacity = A.sombraChao * dia;
    const c = corCeu(el);
    scene.background.copy(c);
    scene.fog.color.copy(c);
    ceuLuz.intensity = A.luzCeu * (1 - noite * .72);
    ceuLuz.color.set('#ffffff').lerp(new THREE.Color('#9aaedc'), noite);
    matLuz.opacity = noite * .92;
    janelasVizinhos.forEach(m => m.emissive.set('#e9b874').multiplyScalar(noite * .5));
    return `#${c.getHexString()}`;
  }

  /* Interação */
  const raio = new THREE.Raycaster(), ponteiro = new THREE.Vector2();
  const rotulo = $('#rotulo');
  let ativa = true, marcado = null, baixou = null;

  function medir() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = camera.aspect < 1.3 ? Math.min(C.fov * 1.3 / camera.aspect, C.fov * 2.1) : C.fov;
    if (w > 900) camera.setViewOffset(w, h, -w * (C.desvioTela || 0), 0, w, h);
    else camera.setViewOffset(w, h, 0, h * .1, w, h);
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', medir);
  medir();

  function posicionarRotulo() {
    if (marcado == null) return;
    const a = P.andares.find(x => x.numero === marcado);
    const y = baseAndar(marcado) + D.alturaAndar / 2;
    let melhor = null;
    const v = new THREE.Vector3();
    for (const [x, z] of D.laje) {
      v.set(x, y, z);
      predio.localToWorld(v).project(camera);
      if (!melhor || v.x < melhor.x) melhor = v.clone();
    }
    rotulo.style.left = `${(melhor.x + 1) / 2 * innerWidth}px`;
    rotulo.style.top = `${(1 - melhor.y) / 2 * innerHeight}px`;
    rotulo.innerHTML = `<b>Andar ${dois(a.numero)}</b><span>${esc(resumoAndar(a))}</span>`;
  }
  function marcar(n) {
    if (n === marcado) return;
    marcado = n;
    faixa.visible = n != null;
    if (n != null) faixa.position.y = baseAndar(n) + .03;
    rotulo.hidden = n == null;
    document.querySelectorAll('.andar').forEach(b => b.classList.toggle('ativo', Number(b.dataset.andar) === n));
    canvas.style.cursor = n != null ? 'pointer' : '';
    posicionarRotulo();
  }
  function apontar(e) {
    ponteiro.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raio.setFromCamera(ponteiro, camera);
    return raio.intersectObjects(alvos)[0]?.object.userData.andar ?? null;
  }
  canvas.addEventListener('pointermove', e => { if (e.pointerType !== 'touch' && !e.buttons) marcar(apontar(e)); });
  canvas.addEventListener('pointerleave', () => marcar(null));
  canvas.addEventListener('pointerdown', e => { baixou = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', e => {
    if (!baixou || Math.hypot(e.clientX - baixou[0], e.clientY - baixou[1]) > 6) return;
    const n = apontar(e);
    if (n != null) location.hash = `andar/${n}`;
  });

  function quadro() {
    controles.update();
    posicionarRotulo();
    renderer.render(scene, camera);
    posicionarPontoSol(pontoPredio, disco.position, controles.target, camera, innerWidth, innerHeight, disco.visible, Math.min(innerWidth, innerHeight) * .36);
  }
  renderer.setAnimationLoop(quadro);

  return {
    ok: true,
    sol: aplicarSol,
    marcar,
    ativar(sim) {
      if (sim === ativa) return;
      ativa = sim;
      if (!sim) marcar(null);
      renderer.setAnimationLoop(sim ? quadro : null);
    },
  };
})();

/* ---------- Sol e sombra ---------- */
(() => {
  const loc = E.localizacao;
  if (!loc || !cena3d.ok) return;
  const painel = $('#sol'), hora = $('#sol-hora'), data = $('#sol-data'), info = $('#sol-info'), tocar = $('#sol-tocar');
  painel.hidden = false;

  function posicaoSol(ms) {
    const r = Math.PI / 180, d = (ms - 946728000000) / 86400000;
    const g = (357.529 + .98560028 * d) * r, q = 280.459 + .98564736 * d;
    const L = (q + 1.915 * Math.sin(g) + .02 * Math.sin(2 * g)) * r, e = (23.439 - .00000036 * d) * r;
    const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));
    const H = ((18.697374558 + 24.06570982441908 * d) * 15 + loc.lon) * r - ra, f = loc.lat * r;
    const el = Math.asin(Math.sin(f) * Math.sin(dec) + Math.cos(f) * Math.cos(dec) * Math.cos(H));
    const az = Math.atan2(-Math.sin(H), Math.tan(dec) * Math.cos(f) - Math.sin(f) * Math.cos(H));
    return { el: el / r, az: (az / r + 360) % 360 };
  }
  const partes = ms => Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: loc.fuso, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    .formatToParts(new Date(ms)).map(p => [p.type, p.value]));
  const desvio = ms => { const p = partes(ms); return Date.UTC(+p.year, p.month - 1, +p.day, +p.hour, +p.minute) - Math.floor(ms / 60000) * 60000; };
  function instante([ano, mes, dia], minutos) {
    const local = Date.UTC(ano, mes - 1, dia, 0, minutos);
    return local - desvio(local - desvio(local));
  }
  const hhmm = m => `${dois(Math.floor(m / 60))}:${dois(m % 60)}`;
  const RUMOS = ['norte', 'nordeste', 'leste', 'sudeste', 'sul', 'sudoeste', 'oeste', 'noroeste'];
  const rumo = az => RUMOS[Math.round(az / 45) % 8];

  /* Fachadas do prédio, com o azimute da normal de cada face */
  const giro = (P.predio.rotacao || 0) * Math.PI / 180, lj = P.predio.laje, s = Math.sign(area(lj));
  const faces = lj.map((a, i) => {
    const b = lj[(i + 1) % lj.length], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const nx = (b[1] - a[1]) / l * s, nz = -(b[0] - a[0]) / l * s;
    const wx = nx * Math.cos(giro) + nz * Math.sin(giro), wz = -nx * Math.sin(giro) + nz * Math.cos(giro);
    return (Math.atan2(wx, -wz) * 180 / Math.PI + (P.terreno.norte || 0) + 360) % 360;
  });

  const hoje = (() => { const p = partes(Date.now()); return [+p.year, +p.month, +p.day]; })();
  const sul = loc.lat < 0;
  const datas = [
    ['hoje', 'Hoje', hoje],
    ['03-20', `20 mar · ${sul ? 'outono' : 'primavera'}`, [hoje[0], 3, 20]],
    ['06-21', `21 jun · ${sul ? 'inverno' : 'verão'}`, [hoje[0], 6, 21]],
    ['09-22', `22 set · ${sul ? 'primavera' : 'outono'}`, [hoje[0], 9, 22]],
    ['12-21', `21 dez · ${sul ? 'verão' : 'inverno'}`, [hoje[0], 12, 21]],
  ];
  data.innerHTML = datas.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
  hora.value = Math.round((loc.horaInicial ?? 14) * 60);

  function nascerPor(dia) {
    /* -0,833° é o horizonte aparente, com refração; é o padrão dos horários oficiais */
    const H0 = -.833;
    let nasce = null, poe = null, antes = posicaoSol(instante(dia, 0)).el;
    for (let m = 1; m < 1440; m++) {
      const el = posicaoSol(instante(dia, m)).el;
      if (antes <= H0 && el > H0 && nasce == null) nasce = m;
      if (antes > H0 && el <= H0) poe = m;
      antes = el;
    }
    return { nasce, poe };
  }

  function atualizar(minutos = Number(hora.value)) {
    const dia = datas.find(d => d[0] === data.value)[2], m = Math.round(minutos);
    const p = posicaoSol(instante(dia, m));
    const cor = cena3d.sol(p);
    solEstado.atual = p;
    solEstado.ouvintes.forEach(f => f(p));
    $('#quadro-3d').classList.toggle('escuro', p.el < -3);
    document.body.style.setProperty('--ceu', cor);
    document.body.classList.toggle('escuro', p.el < -3);
    $('#sol-hora-txt').textContent = hhmm(m);
    if (p.el > 0) {
      const lit = [...new Set(faces.filter(f => Math.cos((f - p.az) * Math.PI / 180) > .1).map(rumo))];
      info.textContent = `Sol a ${Math.round(p.el)}° de altura, vindo do ${rumo(p.az)}. Bate nas faces ${lit.join(', ').replace(/, ([^,]*)$/, ' e $1')}.`;
    } else {
      const { nasce, poe } = nascerPor(dia);
      info.textContent = nasce == null ? 'Sol abaixo do horizonte o dia todo.' : `${p.el > -6 ? 'Crepúsculo' : 'Noite'}. O sol nasce às ${hhmm(nasce)} e se põe às ${hhmm(poe)}.`;
    }
  }

  let animacao = null;
  function parar() { cancelAnimationFrame(animacao); animacao = null; tocar.textContent = '▶'; tocar.setAttribute('aria-label', 'Passar o dia'); }
  tocar.onclick = () => {
    if (animacao) return parar();
    if (Number(hora.value) >= 1435) hora.value = 300;
    tocar.textContent = '❚❚';
    tocar.setAttribute('aria-label', 'Pausar');
    /* Uma hora do dia por segundo */
    let minutos = Number(hora.value), ultimo = performance.now();
    const passo = agora => {
      minutos = Math.min(1435, minutos + (agora - ultimo) / 1000 * 60);
      ultimo = agora;
      hora.value = minutos;
      atualizar(minutos);
      if (minutos >= 1435) return parar();
      animacao = requestAnimationFrame(passo);
    };
    animacao = requestAnimationFrame(passo);
  };
  hora.addEventListener('input', () => { parar(); atualizar(); });
  data.addEventListener('change', () => atualizar());
  atualizar();
})();

/* ---------- Planta em SVG ---------- */
const CSS_PLANTA = `
  .pl text { font-family: "Hanken Grotesk", system-ui, sans-serif; fill: #55594f; font-size: 25px; text-anchor: middle; dominant-baseline: middle; }
  .pl .numero { fill: #1b1e1c; font-size: 66px; font-weight: 600; letter-spacing: -1px; }
  .pl .m2 { font-size: 24px; }
  .pl .piso { fill: #f6f5f0; }
  .pl .piso-comum { fill: #e3e2d9; }
  .pl .molhado { fill: #dfe3e2; }
  .pl .movel { fill: #fbfaf7; stroke: #a9aaa2; stroke-width: 1.6; }
  .pl .parede { stroke: #1b1e1c; stroke-linecap: butt; fill: none; }
  .pl .pilar { fill: #1b1e1c; }
  .pl .porta { fill: none; stroke: #1b1e1c; stroke-width: 1.6; }
  .pl .janela { fill: none; stroke: #8c9490; stroke-width: 5; }
  .pl .janela-luz { fill: none; stroke: #f6f5f0; stroke-width: 2; }
  .pl .degrau { stroke: #8d8e86; stroke-width: 2; }
  .pl .fora { stroke: #1b1e1c; stroke-width: 3; }

  .pl .apto:hover .apto-area, .pl .apto:focus-visible .apto-area, .pl .apto.sel .apto-area { fill: DESTAQUE; fill-opacity: .12; stroke: DESTAQUE; }
  .pl .apto { outline: none; }
`.replace(/DESTAQUE/g, P.ambiente.destaque || '#2a3ab8');

function svgPlanta(a) {
  const pl = P.plantas[a.planta];
  const u = v => +(v * 100).toFixed(1);
  const pts = p => p.map(([x, y]) => `${u(x)},${u(y)}`).join(' ');
  const m = 40, w = u(pl.largura) + m * 2, h = u(pl.profundidade) + m * 2;
  const aptoDa = tipo => a.apartamentos.find(x => x.tipo === tipo);
  const o = [];
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" class="pl" viewBox="${-m} ${-m} ${w} ${h}" role="group" aria-label="Planta do andar ${a.numero}">`);
  o.push(`<style>${CSS_PLANTA}</style>`);
  o.push(`<defs>
    <pattern id="hachura-fora" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#d5dfcd"/><line x1="0" y1="0" x2="0" y2="14" stroke="#a7b59d" stroke-width="2"/></pattern>
    <pattern id="hachura-reservado" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="22" stroke="#777a74" stroke-opacity=".28" stroke-width="3"/></pattern>
  </defs>`);
  for (const e of pl.exteriores) o.push(`<polygon points="${pts(e.pontos)}" fill="url(#hachura-fora)" class="fora"/>`);
  for (const un of pl.unidades) o.push(`<polygon class="piso" points="${pts(un.contorno)}"/>`);
  for (const c of pl.areasComuns) o.push(`<polygon class="piso-comum" points="${pts(c.pontos)}"/>`);
  for (const r of pl.molhados) o.push(`<rect class="molhado" x="${u(r[0])}" y="${u(r[1])}" width="${u(r[2])}" height="${u(r[3])}"/>`);
  if (pl.escada) {
    const [x, y, l, al] = pl.escada.ret;
    o.push(`<rect class="movel" x="${u(x)}" y="${u(y)}" width="${u(l)}" height="${u(al)}"/>`);
    for (let i = 1; i < pl.escada.degraus; i++) { const yy = u(y + al * i / pl.escada.degraus); o.push(`<line class="degrau" x1="${u(x)}" x2="${u(x + l)}" y1="${yy}" y2="${yy}"/>`); }
  }
  for (const k of pl.moveis) {
    if (k.c) { o.push(`<circle class="movel" cx="${u(k.c[0])}" cy="${u(k.c[1])}" r="${u(k.c[2])}"/>`); continue; }
    const [x, y, l, al] = k.r;
    o.push(`<rect class="movel" x="${u(x)}" y="${u(y)}" width="${u(l)}" height="${u(al)}"/>`);
    const s = .42;
    if (k.cab === 'e') o.push(`<line class="movel" x1="${u(x + s)}" x2="${u(x + s)}" y1="${u(y)}" y2="${u(y + al)}"/>`);
    if (k.cab === 'd') o.push(`<line class="movel" x1="${u(x + l - s)}" x2="${u(x + l - s)}" y1="${u(y)}" y2="${u(y + al)}"/>`);
    if (k.cab === 'c') o.push(`<line class="movel" x1="${u(x)}" x2="${u(x + l)}" y1="${u(y + s)}" y2="${u(y + s)}"/>`);
    if (k.cab === 'b') o.push(`<line class="movel" x1="${u(x)}" x2="${u(x + l)}" y1="${u(y + al - s)}" y2="${u(y + al - s)}"/>`);
  }
  o.push(`<polygon class="janela" points="${pts(pl.janelas)}"/><polygon class="janela-luz" points="${pts(pl.janelas)}"/>`);
  for (const [x1, y1, x2, y2, e] of pl.paredes) o.push(`<line class="parede" x1="${u(x1)}" y1="${u(y1)}" x2="${u(x2)}" y2="${u(y2)}" stroke-width="${e * 100}"/>`);
  for (const r of pl.pilares) o.push(`<rect class="pilar" x="${u(r[0])}" y="${u(r[1])}" width="${u(r[2])}" height="${u(r[3])}"/>`);
  for (const [x, y, r, de, ate] of pl.portas) {
    const p = g => [u(x + r * Math.cos(g * Math.PI / 180)), u(y + r * Math.sin(g * Math.PI / 180))];
    const [ax, ay] = p(de), [bx, by] = p(ate);
    o.push(`<path class="porta" d="M${u(x)} ${u(y)}L${ax} ${ay}A${u(r)} ${u(r)} 0 0 ${ate > de ? 1 : 0} ${bx} ${by}"/>`);
  }
  for (const t of pl.rotulos) o.push(`<text x="${u(t.x)}" y="${u(t.y)}">${esc(t.texto)}</text>`);
  for (const un of pl.unidades) {
    const ap = aptoDa(un.tipo);
    if (!ap) continue;
    o.push(`<text class="numero" x="${u(un.rotulo[0])}" y="${u(un.rotulo[1])}">${esc(ap.id)}</text>`);
    o.push(`<text class="m2" x="${u(un.rotulo[0])}" y="${u(un.rotulo[1]) + 58}">${P.tipologias[ap.tipo].areaInterna} m²</text>`);
    const estado = ap.status === 'disponivel' ? '' : `, ${NOME_ESTADO[ap.status].toLowerCase()}`;
    o.push(`<g class="apto ${ap.status}" data-id="${esc(ap.id)}" tabindex="0" role="button" aria-label="Apartamento ${esc(ap.id)}, ${quartos(P.tipologias[ap.tipo].quartos)}, ${P.tipologias[ap.tipo].areaInterna} m²${esc(estado)}"><polygon class="apto-area" points="${pts(un.contorno)}"/></g>`);
  }
  if (pl.norte != null) {
    const nx = u(pl.largura) + 8;
    o.push(`<g transform="translate(${nx} -14) rotate(${pl.norte})"><text x="0" y="-16" style="font-size:20px">N</text><line x1="0" y1="0" x2="0" y2="44" stroke="#1b1e1c" stroke-width="3"/></g>`);
  }
  o.push('</svg>');
  return o.join('');
}

/* ---------- Apartamento em 3D ---------- */
const decimal = v => v.toLocaleString(E.idioma || 'pt-BR', { maximumFractionDigits: 1 });
function planoDe(ap) {
  const a = P.andares.find(x => x.numero === ap.andar), planta = P.plantas[a.planta];
  return { planta, un: planta.unidades.find(u => u.tipo === ap.tipo) };
}
function comodosDe(ap) {
  return (planoDe(ap).un?.comodos || []).map(c => {
    const xs = c.pontos.map(p => p[0]), ys = c.pontos.map(p => p[1]);
    const l = Math.max(...xs) - Math.min(...xs), a = Math.max(...ys) - Math.min(...ys), m = Math.abs(area(c.pontos));
    return { ...c, area: m, medida: Math.abs(m - l * a) < .02 ? `${decimal(l)} × ${decimal(a)} m` : '' };
  });
}
const tem3d = ap => cena3d.ok && !!P.apartamento3d && comodosDe(ap).length > 0;

const apto3d = (() => {
  const caixa = $('#quadro-3d'), canvas = $('#cena-apto'), camada = $('#etiquetas');
  let renderer, scene, camera, controles, grupo, pisos = [], etiquetas = [], rodando = false;
  let ceu, solLuz, disco, pontoApto, chaoSombra, luzesInt = [];
  const giroPredio = (P.predio.rotacao || 0) * Math.PI / 180;
  let medidaFit = 20, fixo = null, baixou = null, posicoes = [];
  const raio = new THREE.Raycaster(), ponteiro = new THREE.Vector2(), v = new THREE.Vector3();

  function iniciar() {
    if (renderer) return;
    const A = P.ambiente;
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(22, 1, 1, 400);
    controles = new OrbitControls(camera, canvas);
    controles.enablePan = false;
    controles.enableDamping = true;
    controles.dampingFactor = .08;
    controles.minPolarAngle = .12;
    controles.maxPolarAngle = 1.3;
    ceu = new THREE.HemisphereLight(0xffffff, new THREE.Color(A.corBaixa), 2.35);
    scene.add(ceu);
    solLuz = new THREE.DirectionalLight(0xfffaf0, 1.05);
    solLuz.position.set(-22, 44, 30);
    solLuz.castShadow = true;
    solLuz.shadow.mapSize.set(2048, 2048);
    Object.assign(solLuz.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 220 });
    solLuz.shadow.bias = -.0004;
    solLuz.shadow.normalBias = .02;
    scene.add(solLuz);
    disco = criarDiscoSol(15);
    disco.visible = false;
    scene.add(disco);
    pontoApto = criarPontoSol(caixa);
    const chao = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.ShadowMaterial({ opacity: .14 }));
    chaoSombra = chao;
    chao.rotation.x = -Math.PI / 2;
    chao.position.y = -.01;
    chao.receiveShadow = true;
    scene.add(chao);
    solEstado.ouvintes.push(aplicarSol);
    new ResizeObserver(enquadrar).observe(caixa);
    canvas.addEventListener('pointermove', e => { if (e.pointerType !== 'touch' && !e.buttons) marcar(apontar(e) ?? fixo); });
    canvas.addEventListener('pointerleave', () => marcar(fixo));
    canvas.addEventListener('pointerdown', e => { baixou = [e.clientX, e.clientY]; });
    canvas.addEventListener('pointerup', e => {
      if (!baixou || Math.hypot(e.clientX - baixou[0], e.clientY - baixou[1]) > 6) return;
      const i = apontar(e);
      fixar(i === fixo ? null : i);
    });
  }

  function apontar(e) {
    const r = canvas.getBoundingClientRect();
    ponteiro.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    raio.setFromCamera(ponteiro, camera);
    return raio.intersectObjects(pisos)[0]?.object.userData.i ?? null;
  }
  function marcar(i) {
    pisos.forEach(p => p.material.color.copy(p.userData.i === i ? p.userData.ativa : p.userData.cor));
    etiquetas.forEach((t, k) => t.classList.toggle('ativa', k === i));
    document.querySelectorAll('[data-comodo]').forEach(b => b.classList.toggle('ativo', Number(b.dataset.comodo) === i));
  }
  function fixar(i) { fixo = i; marcar(i); }

  function dentro([x, y], p) {
    let d = false;
    p.forEach(([a, b], i) => {
      const [c, e] = p[(i + 1) % p.length];
      if ((b > y) !== (e > y) && x < (c - a) * (y - b) / (e - b) + a) d = !d;
    });
    return d;
  }
  function perto(pt, p, tol) {
    return p.some((a, i) => {
      const b = p[(i + 1) % p.length], dx = b[0] - a[0], dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((pt[0] - a[0]) * dx + (pt[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      return Math.hypot(pt[0] - a[0] - dx * t, pt[1] - a[1] - dy * t) < tol;
    });
  }
  function recortar(a, b, p) {
    const ts = [0, 1], dx = b[0] - a[0], dy = b[1] - a[1];
    p.forEach((c, i) => {
      const d = p[(i + 1) % p.length], ex = d[0] - c[0], ey = d[1] - c[1], k = dx * ey - dy * ex;
      if (Math.abs(k) < 1e-9) return;
      const t = ((c[0] - a[0]) * ey - (c[1] - a[1]) * ex) / k, u = ((c[0] - a[0]) * dy - (c[1] - a[1]) * dx) / k;
      if (t > 0 && t < 1 && u >= 0 && u <= 1) ts.push(t);
    });
    ts.sort((m, n) => m - n);
    const pedacos = [];
    for (let i = 0; i < ts.length - 1; i++) {
      const m = (ts[i] + ts[i + 1]) / 2;
      if (dentro([a[0] + dx * m, a[1] + dy * m], p)) pedacos.push([[a[0] + dx * ts[i], a[1] + dy * ts[i]], [a[0] + dx * ts[i + 1], a[1] + dy * ts[i + 1]]]);
    }
    return pedacos;
  }

  /* Móveis: cada tipo vira caixas simples em escala real. Novos tipos entram aqui. */
  function mobiliar(m, L) {
    if (m.c) {
      const [x, z, r] = m.c;
      for (const [raioM, y, alt] of [[r, .73, .05], [.07, .37, .72]]) {
        const c = malha(new THREE.CylinderGeometry(raioM, raioM, alt, 20), L.matMadeira);
        c.position.set(x, y, z);
        grupo.add(c);
      }
      return;
    }
    const [x, y, l, a] = m.r, cx = x + l / 2, cz = y + a / 2;
    const d = { e: [1, 0], d: [-1, 0], c: [0, 1], b: [0, -1] }[m.cab] || [1, 0];
    const longo = d[0] ? l : a, largo = d[0] ? a : l;
    const ao = (lote, ao_, atr, yy, comp, larg, alt) => lote.caixa(cx + d[0] * ao_ - d[1] * atr, yy, cz + d[1] * ao_ + d[0] * atr, d[0] ? comp : larg, alt, d[0] ? larg : comp);
    const pernas = (h, top) => {
      L.madeira.caixa(cx, h, cz, l, top, a);
      for (const [sx, sz] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) L.madeira.caixa(cx + sx * (l / 2 - .06), (h - top / 2) / 2, cz + sz * (a / 2 - .06), .06, h - top / 2, .06);
    };
    switch (m.tipo) {
      case 'cama':
        L.branco.caixa(cx, .22, cz, l, .44, a);
        ao(L.tecido, longo * .16, 0, .47, longo * .68, largo + .02, .08);
        for (const s of [-1, 1]) ao(L.branco, -longo * .36, s * largo * .23, .5, .34, largo * .4, .14);
        break;
      case 'sofa':
        L.tecido.caixa(cx, .2, cz, l, .4, a);
        ao(L.tecido, -longo / 2 + .12, 0, .42, .24, largo, .84);
        for (const s of [-1, 1]) ao(L.tecido, 0, s * (largo / 2 - .1), .3, longo, .2, .6);
        break;
      case 'mesa': pernas(.75, .05); break;
      case 'mesaCentro': pernas(.38, .04); break;
      case 'bancada':
        L.branco.caixa(cx, .43, cz, l, .86, a);
        L.pedra.caixa(cx, .88, cz, l + .03, .04, a + .03);
        break;
      case 'banheira':
        L.branco.caixa(cx, .27, cz, l, .54, a);
        L.vidroClaro.caixa(cx, .55, cz, l - .14, .02, a - .14);
        break;
      case 'pia':
        L.branco.caixa(cx, .42, cz, l, .84, a);
        L.vidroClaro.caixa(cx, .85, cz, l * .6, .02, a * .6);
        break;
      case 'box': L.vidroClaro.caixa(cx, .04, cz, l, .08, a); break;
      default: break;
    }
  }

  /* Sol, sombra e luz de dentro: de noite o sol some e os cômodos acendem */
  function aplicarSol(p) {
    if (!renderer) return;
    const dia = clamp01(p.el / 12), noite = clamp01((2 - p.el) / 8), dir = direcaoSol(p, giroPredio);
    solLuz.position.copy(dir).multiplyScalar(80);
    solLuz.intensity = 1.3 * dia;
    solLuz.color.set('#ffb36b').lerp(new THREE.Color('#fffaf0'), clamp01(p.el / 25));
    chaoSombra.material.opacity = .14 * dia;
    ceu.intensity = 2.35 - .15 * dia - noite * 1.2;
    ceu.color.set('#ffffff').lerp(new THREE.Color('#9aaedc'), noite);
    luzesInt.forEach(l => { l.intensity = noite * 26; });
    disco.position.copy(dir).multiplyScalar(70);
    ajustarDiscoSol(disco, p);
  }

  function montar(ap) {
    if (grupo) {
      scene.remove(grupo);
      grupo.traverse(o => { if (o.isMesh) { if (o.geometry !== unidade) o.geometry.dispose(); o.material.dispose(); o.dispose?.(); } });
    }
    const { planta: pl, un } = planoDe(ap), cfg = P.apartamento3d, c = cfg.cores, altura = cfg.alturaParede;
    const comodos = comodosDe(ap);
    const tudo = comodos.flatMap(k => k.pontos).concat(un.contorno);
    const minX = Math.min(...tudo.map(p => p[0])), maxX = Math.max(...tudo.map(p => p[0]));
    const minY = Math.min(...tudo.map(p => p[1])), maxY = Math.max(...tudo.map(p => p[1]));
    grupo = new THREE.Group();
    grupo.position.set(-(minX + maxX) / 2, 0, -(minY + maxY) / 2);
    scene.add(grupo);
    medidaFit = Math.hypot(maxX - minX, maxY - minY) * .78 + 2;

    /* Teto invisível: não aparece, mas faz sombra, então o sol só entra pelas janelas e pelo terraço */
    grupo.add(malha(prisma(un.contorno, .04, altura + .17), new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false }), { recebe: false }));
    luzesInt.forEach(l => grupo.remove(l));
    luzesInt = comodos.filter(k => !k.externo).slice(0, 8).map(k => {
      const l = new THREE.PointLight('#ffd2a0', 0, 0, 2);
      l.position.set(k.rotulo[0], altura - .3, k.rotulo[1]);
      grupo.add(l);
      return l;
    });

    const expandido = deslocar(un.contorno, .14);
    const exteriores = comodos.filter(k => k.externo).map(k => k.pontos);
    const naFachada = pt => perto(pt, pl.janelas, .15) || exteriores.some(p => perto(pt, p, .15));

    grupo.add(malha(prisma(deslocar(un.contorno, .1), .14), lambert(c.base)));
    for (const p of exteriores) grupo.add(malha(prisma(p, .14), lambert(c.base)));

    const paredes = lote(lambert(c.parede)), cortes = lote(lambert(c.corte));
    const vidros = lote(new THREE.MeshLambertMaterial({ color: c.vidro, transparent: true, opacity: .34, depthWrite: false }));
    const caixilhos = lote(lambert(c.caixilho)), portasL = lote(lambert(c.movel));
    const L = {
      branco: lote(lambert(c.movel)), tecido: lote(lambert(c.tecido)), madeira: lote(lambert(c.madeira)),
      pedra: lote(lambert(c.bancada)), vidroClaro: lote(lambert(c.vidro)), matMadeira: lambert(c.madeira),
    };

    const envidracar = (a, b) => {
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
      vidros.viga(a, b, altura / 2 + .1, .05, altura - .2);
      caixilhos.viga(a, b, altura + .03, .07, .06);
      caixilhos.viga(a, b, .17, .07, .06);
      const n = Math.max(1, Math.round(l / 1.3));
      for (let i = 0; i <= n; i++) caixilhos.caixa(a[0] + dx * i / n, altura / 2 + .1, a[1] + dy * i / n, .06, altura - .2, .06);
    };

    const cobertos = [];
    for (const [x1, y1, x2, y2, e] of pl.paredes) {
      for (const [a, b] of recortar([x1, y1], [x2, y2], expandido)) {
        const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (l < .25) continue;
        const meio = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        cobertos.push([a, b]);
        if (e <= .12 && naFachada(meio)) { envidracar(a, b); continue; }
        const ux = (b[0] - a[0]) / l * e / 2, uy = (b[1] - a[1]) / l * e / 2;
        const u = [a[0] - ux, a[1] - uy], w = [b[0] + ux, b[1] + uy];
        paredes.viga(u, w, altura / 2 + .14, e, altura);
        cortes.viga(u, w, altura + .155, e + .01, .03);
      }
    }
    /* Trechos do contorno sem parede: vidro na fachada, vão aberto no restante */
    un.contorno.forEach((a, i) => {
      const b = un.contorno[(i + 1) % un.contorno.length], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
      if (!l) return;
      const passo = .1, n = Math.ceil(l / passo);
      let inicio = null;
      for (let k = 0; k <= n; k++) {
        const t = k / n, pt = [a[0] + dx * t, a[1] + dy * t];
        const livre = k < n && !cobertos.some(([p, q]) => perto(pt, [p, q], .2));
        if (livre && inicio == null) inicio = t;
        if (!livre && inicio != null) {
          const u = [a[0] + dx * inicio, a[1] + dy * inicio], w = pt;
          if (Math.hypot(w[0] - u[0], w[1] - u[1]) > .3 && naFachada([(u[0] + w[0]) / 2, (u[1] + w[1]) / 2])) envidracar(u, w);
          inicio = null;
        }
      }
    });
    for (const [x, y, l, a] of pl.pilares) {
      if (!dentro([x + l / 2, y + a / 2], expandido)) continue;
      paredes.caixa(x + l / 2, altura / 2 + .14, y + a / 2, l, altura, a);
      cortes.caixa(x + l / 2, altura + .155, y + a / 2, l + .01, .03, a + .01);
    }
    for (const [x, y, r, de] of pl.portas) {
      if (!dentro([x, y], expandido)) continue;
      const g = de * Math.PI / 180;
      portasL.viga([x, y], [x + r * Math.cos(g), y + r * Math.sin(g)], 1.19, .04, 2.1);
    }
    for (const m of pl.moveis) {
      const centro = m.c ? [m.c[0], m.c[1]] : [m.r[0] + m.r[2] / 2, m.r[1] + m.r[3] / 2];
      if (dentro(centro, un.contorno)) mobiliar(m, L);
    }
    /* Guarda-corpo das áreas externas: só nos lados fora do contorno */
    for (const p of exteriores) {
      p.forEach((a, i) => {
        const b = p[(i + 1) % p.length], meio = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        if (perto(meio, un.contorno, .25)) return;
        caixilhos.viga(a, b, 1.2, .05, .05);
        vidros.viga(a, b, .68, .03, 1);
      });
    }
    pisos = comodos.map((k, i) => {
      const cor = new THREE.Color(k.externo ? c.externo : k.molhado ? c.molhado : c.piso);
      const m = malha(prisma(k.pontos, .03, .14), lambert(cor), { lanca: false });
      m.userData = { i, cor, ativa: cor.clone().lerp(new THREE.Color(P.ambiente.destaque), .42) };
      grupo.add(m);
      return m;
    });
    [paredes, cortes, caixilhos, portasL, L.branco, L.tecido, L.madeira, L.pedra, L.vidroClaro].forEach(l => l.criar(grupo));
    vidros.criar(grupo, { lanca: false, recebe: false });

    camada.innerHTML = comodos.map(k => `<span class="etq"><b>${esc(k.nome)}</b>${m2(+k.area.toFixed(1))}</span>`).join('');
    etiquetas = [...camada.children];
    posicoes = comodos.map(k => k.rotulo);
    fixo = null;
    /* A câmera nasce do lado da fachada; giro3d nos dados substitui essa escolha */
    const centroY = (Math.min(...un.contorno.map(p => p[1])) + Math.max(...un.contorno.map(p => p[1]))) / 2;
    posicaoInicial(un.giro3d ?? (centroY < Math.max(...pl.janelas.map(p => p[1])) * .4 ? Math.PI - .42 : .42));
  }

  function posicaoInicial(giro) {
    const elev = 1.02;
    camera.position.set(Math.sin(giro) * Math.cos(elev), Math.sin(elev), Math.cos(giro) * Math.cos(elev));
    enquadrar();
  }
  function enquadrar() {
    const w = caixa.clientWidth, h = caixa.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    const meia = Math.tan(camera.fov * Math.PI / 360);
    const dist = medidaFit / 2 / Math.min(meia, meia * camera.aspect) * 1.12;
    camera.position.setLength(dist);
    controles.target.set(0, .8, 0);
    controles.minDistance = dist * .5;
    controles.maxDistance = dist * 1.5;
    controles.update();
  }
  function quadro() {
    controles.update();
    renderer.render(scene, camera);
    const w = caixa.clientWidth, h = caixa.clientHeight;
    etiquetas.forEach((t, i) => {
      v.set(posicoes[i][0], .3, posicoes[i][1]);
      grupo.localToWorld(v).project(camera);
      t.style.transform = `translate(-50%, -50%) translate(${(v.x + 1) / 2 * w}px, ${(1 - v.y) / 2 * h}px)`;
    });
    posicionarPontoSol(pontoApto, disco.position, controles.target, camera, w, h, disco.visible, Math.min(w, h) * .4);
  }

  return {
    mostrar(ap, pendente) {
      iniciar();
      montar(ap);
      if (solEstado.atual) aplicarSol(solEstado.atual);
      if (!rodando) { rodando = true; renderer.setAnimationLoop(quadro); }
      fixar(pendente ?? null);
    },
    parar() { if (rodando) { rodando = false; renderer.setAnimationLoop(null); } },
    marcar(i) { if (rodando) marcar(i ?? fixo); },
    fixar(i) { if (rodando) fixar(i === fixo ? null : i); },
  };
})();

/* ---------- Telas ---------- */
const est = { andar: null, apto: null, svgDe: null, modo3d: false, comodo: null };
const quadroPlanta = $('#quadro-planta'), quadro3d = $('#quadro-3d'), ficha = $('#ficha'), dica = $('#dica-apto');

function irPara(rota) { if (location.hash.slice(1) === rota) aplicarRota(); else location.hash = rota; }
const achar = id => aptos.find(x => x.id === id);

function aplicarRota() {
  const m = location.hash.match(/^#(andar|apto)\/([\w.-]+?)(\/3d)?$/);
  let andar = null, apto = null;
  if (m?.[1] === 'andar') andar = P.andares.find(a => String(a.numero) === m[2]) ?? null;
  if (m?.[1] === 'apto' && achar(m[2])) { apto = achar(m[2]); andar = P.andares.find(a => a.numero === apto.andar); }
  est.andar = andar; est.apto = apto;
  est.modo3d = !!(apto && m?.[3] && tem3d(apto));
  const painelSol = $('#sol'), destinoSol = est.modo3d ? quadro3d : $('#vista-predio');
  if (painelSol.parentElement !== destinoSol) destinoSol.appendChild(painelSol);
  painelSol.classList.toggle('no-apto', est.modo3d);
  const emPlanta = !!andar;
  document.body.dataset.vista = emPlanta ? 'planta' : 'predio';
  $('#vista-predio').hidden = emPlanta;
  $('#vista-planta').hidden = !emPlanta;
  $('#veu').hidden = emPlanta;
  cena3d.ativar(!emPlanta);
  dica.hidden = true;
  if (emPlanta) mostrarPlanta(andar, apto);
  else fecharFicha();
  if (!est.modo3d) apto3d.parar();
}

function mostrarPlanta(a, ap) {
  $('#andar-titulo').textContent = `Andar ${a.numero}`;
  $('#andar-resumo').textContent = resumoAndar(a);
  const i = andares.indexOf(a);
  $('#subir').disabled = i === 0;
  $('#descer').disabled = i === andares.length - 1;
  $('#legenda').hidden = !!ap;
  $('#modos').hidden = !(ap && tem3d(ap));
  $('#modo-planta').setAttribute('aria-pressed', !est.modo3d);
  $('#modo-3d').setAttribute('aria-pressed', est.modo3d);
  document.body.dataset.modo = est.modo3d ? '3d' : 'planta';
  quadroPlanta.hidden = est.modo3d;
  quadro3d.hidden = !est.modo3d;
  $('#pe-planta').textContent = est.modo3d ? 'Arraste para girar. Móveis ilustrativos e medidas aproximadas.' : 'Selecione um apartamento para ver detalhes e preço';
  if (est.svgDe !== a.numero) { quadroPlanta.innerHTML = svgPlanta(a); est.svgDe = a.numero; }
  const svg = $('svg', quadroPlanta);
  svg.classList.toggle('com-selecao', !!ap);
  svg.querySelectorAll('.apto').forEach(g => g.classList.toggle('sel', g.dataset.id === ap?.id));
  if (ap) abrirFicha(ap); else fecharFicha();
  if (est.modo3d) {
    apto3d.mostrar(ap, est.comodo);
    est.comodo = null;
  }
  const sel = svg.querySelector('.apto.sel');
  if (sel && quadroPlanta.scrollWidth > quadroPlanta.clientWidth) {
    const r = sel.getBoundingClientRect(), q = quadroPlanta.getBoundingClientRect();
    quadroPlanta.scrollLeft += r.left + r.width / 2 - (q.left + q.width / 2);
  }
}

function fecharFicha() { ficha.classList.remove('aberta'); ficha.innerHTML = ''; }
function abrirFicha(ap) {
  const t = ap.t, vendido = ap.status !== 'disponivel', comodos = comodosDe(ap);
  ficha.innerHTML = `<div class="ficha-corpo">
    <button class="voltar" id="ficha-voltar" type="button"><span aria-hidden="true">←</span> Planta do andar</button>
    <p class="sub">Andar ${ap.andar} de ${P.andares.length}</p>
    <h3>Apartamento ${esc(ap.id)}</h3>
    <p class="desc">${esc(t.descricao)}</p>
    <div class="preco">
      <strong>${ap.status === 'vendido' ? `<s>${dinheiro(ap.preco)}</s>` : dinheiro(ap.preco)}</strong>
      <span class="estado ${ap.status}">${NOME_ESTADO[ap.status]}</span>
    </div>
    <dl class="fatos">
      <div><dt>Área interna</dt><dd>${m2(t.areaInterna)}</dd></div>
      <div><dt>Quartos</dt><dd>${t.quartos}</dd></div>
      <div><dt>Banheiros</dt><dd>${t.banheiros}</dd></div>
      <div><dt>${esc(t.nomeExterna)}</dt><dd>${m2(t.areaExterna)}</dd></div>
      <div><dt>Área total</dt><dd>${m2(t.areaTotal)}</dd></div>
    </dl>
    <dl class="linhas">
      <div><dt>${esc(t.nomeSala)}</dt><dd>${m2(t.areaSala)}</dd></div>
      <div><dt>Distribuição</dt><dd>${esc(t.distribuicao)}</dd></div>
      <div><dt>Orientação</dt><dd>${esc(t.orientacao)}</dd></div>
    </dl>
    ${comodos.length ? `<h4 class="tit-comodos">Cômodos</h4>
    <ul class="comodos">${comodos.map((c, i) => `<li><button type="button" data-comodo="${i}"><span>${esc(c.nome)}${c.medida ? `<small>${c.medida}</small>` : ''}</span><b>${m2(+c.area.toFixed(1))}</b></button></li>`).join('')}</ul>` : ''}
    <button class="botao forte" id="ficha-contato" type="button">${vendido ? 'Perguntar sobre apartamentos similares' : 'Tenho interesse neste apartamento'}</button>
    <button class="botao" id="ficha-baixar" type="button">Baixar planta</button>
    <p class="nota">${esc(E.notaFicha)}</p>
  </div>`;
  ficha.classList.add('aberta');
  $('#ficha-voltar').onclick = () => irPara(`andar/${ap.andar}`);
  $('#ficha-contato').onclick = () => abrirContato(ap);
  $('#ficha-baixar').onclick = () => baixarPlanta(ap);
}

function baixarPlanta(ap) {
  const a = P.andares.find(x => x.numero === ap.andar);
  const url = URL.createObjectURL(new Blob([svgPlanta(a)], { type: 'image/svg+xml' }));
  const l = Object.assign(document.createElement('a'), { href: url, download: `planta-andar-${ap.andar}.svg` });
  l.click();
  URL.revokeObjectURL(url);
}

function abrirContato(ap) {
  const corpo = $('#contato-corpo'), modal = $('#modal-contato');
  const sub = ap ? `Apartamento ${ap.id}, andar ${ap.andar}, ${dinheiro(ap.preco)}${ap.status === 'disponivel' ? '' : `, ${NOME_ESTADO[ap.status].toLowerCase()}`}.` : E.nome;
  const msg = ap ? `Gostaria de saber mais sobre o apartamento ${ap.id}.` : '';
  corpo.innerHTML = `<header><h2>Contato</h2><button class="fechar" type="button" aria-label="Fechar">×</button></header>
    <p class="sub">${esc(sub)}</p>
    <form id="form-contato">
      <label class="campo">Nome <input name="nome" required autocomplete="name"></label>
      <label class="campo">E-mail <input name="email" type="email" required autocomplete="email"></label>
      <label class="campo">Telefone <small>(opcional)</small> <input name="telefone" type="tel" autocomplete="tel"></label>
      <label class="campo">Mensagem <textarea name="mensagem">${esc(msg)}</textarea></label>
      <label class="marcar"><input type="checkbox" name="visita"> Quero agendar uma visita</label>
      <button class="botao forte" type="submit">Enviar mensagem</button>
    </form>`;
  $('.fechar', corpo).onclick = () => modal.close();
  $('#form-contato').onsubmit = e => {
    e.preventDefault();
    const d = new FormData(e.target), zap = P.contato?.whatsapp;
    if (zap) {
      const texto = [d.get('mensagem'), `Nome: ${d.get('nome')}`, `E-mail: ${d.get('email')}`, d.get('telefone') && `Telefone: ${d.get('telefone')}`, d.get('visita') && 'Quero agendar uma visita.'].filter(Boolean).join('\n');
      open(`https://wa.me/${zap}?text=${encodeURIComponent(texto)}`, '_blank', 'noopener');
    }
    corpo.innerHTML = `<header><h2>Obrigado</h2><button class="fechar" type="button" aria-label="Fechar">×</button></header>
      <p class="sub">${zap ? 'Sua mensagem foi aberta no WhatsApp. Envie por lá para concluir.' : 'Esta é uma demonstração: nenhum dado foi enviado.'}</p>
      <button class="botao" type="button" id="contato-ok">Fechar</button>`;
    $('.fechar', corpo).onclick = $('#contato-ok').onclick = () => modal.close();
  };
  modal.showModal();
}

function abrirSobre() {
  const c = $('#sobre-corpo'), modal = $('#modal-sobre');
  c.innerHTML = `<header><h2>${esc(E.sobre.titulo)}</h2><button class="fechar" type="button" aria-label="Fechar">×</button></header>
    <div style="height:12px"></div>
    ${E.sobre.paragrafos.map(p => `<p>${esc(p)}</p>`).join('')}
    <dl class="grade-sobre">${E.sobre.fatos.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    <p class="nota">${esc(E.sobre.nota)}</p>`;
  $('.fechar', c).onclick = () => modal.close();
  modal.showModal();
}

/* ---------- Eventos ---------- */
$('#lista-andares').addEventListener('click', e => { const b = e.target.closest('.andar'); if (b) irPara(`andar/${b.dataset.andar}`); });
$('#lista-andares').addEventListener('pointerover', e => { const b = e.target.closest('.andar'); if (b) cena3d.marcar(Number(b.dataset.andar)); });
$('#lista-andares').addEventListener('pointerleave', () => cena3d.marcar(null));
$('#lista-andares').addEventListener('focusin', e => { const b = e.target.closest('.andar'); if (b) cena3d.marcar(Number(b.dataset.andar)); });
$('#voltar').onclick = $('#ir-residencias').onclick = $('#marca').onclick = () => irPara('');
$('#ir-sobre').onclick = abrirSobre;
$('#ir-contato').onclick = () => abrirContato(est.apto);
function trocarAndar(passo) {
  const i = andares.indexOf(est.andar) - passo;
  if (andares[i]) irPara(`andar/${andares[i].numero}`);
}
$('#modo-planta').onclick = () => { if (est.apto) irPara(`apto/${est.apto.id}`); };
$('#modo-3d').onclick = () => { if (est.apto) irPara(`apto/${est.apto.id}/3d`); };
ficha.addEventListener('click', e => {
  const b = e.target.closest('[data-comodo]');
  if (!b) return;
  const i = Number(b.dataset.comodo);
  if (est.modo3d) { apto3d.fixar(i); return; }
  est.comodo = i;
  irPara(`apto/${est.apto.id}/3d`);
});
ficha.addEventListener('pointerover', e => { const b = e.target.closest('[data-comodo]'); if (b && e.pointerType !== 'touch') apto3d.marcar(Number(b.dataset.comodo)); });
ficha.addEventListener('pointerout', e => { if (e.target.closest('[data-comodo]') && e.pointerType !== 'touch') apto3d.marcar(null); });
$('#subir').onclick = () => trocarAndar(1);
$('#descer').onclick = () => trocarAndar(-1);

function mostrarDica(g, x, y) {
  const ap = achar(g.dataset.id), t = ap.t;
  const estado = ap.status === 'disponivel' ? dinheiro(ap.preco) : NOME_ESTADO[ap.status].toLowerCase();
  dica.innerHTML = `<b>Apartamento ${esc(ap.id)}</b>${quartos(t.quartos)}, ${t.areaInterna} m², ${esc(estado)}`;
  dica.hidden = false;
  const lar = dica.offsetWidth;
  dica.style.left = `${Math.min(x + 16, innerWidth - lar - 12)}px`;
  dica.style.top = `${y + 18}px`;
}
quadroPlanta.addEventListener('pointermove', e => {
  const g = e.target.closest?.('.apto');
  if (g && e.pointerType !== 'touch') mostrarDica(g, e.clientX, e.clientY); else dica.hidden = true;
});
quadroPlanta.addEventListener('pointerleave', () => { dica.hidden = true; });
quadroPlanta.addEventListener('click', e => { const g = e.target.closest?.('.apto'); if (g) { dica.hidden = true; irPara(`apto/${g.dataset.id}`); } });
quadroPlanta.addEventListener('keydown', e => {
  const g = e.target.closest?.('.apto');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); irPara(`apto/${g.dataset.id}`); }
});
quadroPlanta.addEventListener('focusin', e => {
  const g = e.target.closest?.('.apto');
  if (g && g.matches(':focus-visible')) { const r = g.getBoundingClientRect(); mostrarDica(g, r.left + r.width / 2, r.top + r.height / 2); }
});
quadroPlanta.addEventListener('focusout', () => { dica.hidden = true; });
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.querySelector('dialog[open]') && est.apto) irPara(`andar/${est.apto.andar}`);
});
addEventListener('hashchange', aplicarRota);
aplicarRota();
</script>
